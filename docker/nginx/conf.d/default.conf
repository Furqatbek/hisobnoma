# NOTE: app and frontend are intentionally NOT static upstreams. They are proxied via
# `set $app_upstream` / `set $frontend_upstream` + a request-time `resolver` in the
# HTTPS server block, so container recreation (new IPs) never strands this proxy.

# Upstream for Grafana
upstream grafana_backend {
    server grafana:3000;
}

# Upstream for Prometheus
upstream prometheus_backend {
    server prometheus:9090;
}

# HTTP Server - serves ACME challenges and redirects to HTTPS when certs exist
server {
    listen 80;
    server_name temurmchj.uz www.temurmchj.uz;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS only if certs exist (nginx will load ssl block)
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main Application Server - HTTPS
server {
    listen 443 ssl http2;
    server_name temurmchj.uz www.temurmchj.uz;

    # SSL Configuration - Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/temurmchj.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temurmchj.uz/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Request ID for tracing
    set $trace_id $request_id;
    if ($http_x_request_id) {
        set $trace_id $http_x_request_id;
    }
    add_header X-Request-ID $trace_id;

    # Resolve app/frontend at REQUEST time via Docker's embedded DNS, not once at startup.
    # With a static `upstream { server app:8080; }` nginx caches the container IP when it
    # starts; after `docker compose up` recreates app/frontend they get new IPs and every
    # request 502s until nginx is restarted. Variable-based proxy_pass re-resolves instead.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8080;
    set $frontend_upstream http://frontend:80;

    # Connection limits
    limit_conn conn_limit 20;

    # Client body size
    client_max_body_size 50M;

    # Uploaded files - proxy to backend
    location /uploads/ {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        expires 7d;
        add_header Cache-Control "public";
    }

    # API endpoints
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $trace_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;
    }

    # Authentication endpoints (stricter rate limiting)
    location /api/v1/auth/ {
        limit_req zone=login_limit burst=10 nodelay;

        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $trace_id;
        proxy_set_header Connection "";
    }

    # Health check endpoint (no rate limit)
    location /actuator/health {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        access_log off;
    }

    # Prometheus metrics (internal only)
    location /actuator/prometheus {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        access_log off;
    }

    # Block access to sensitive actuator endpoints
    location /actuator/ {
        deny all;
        return 403;
    }

    # Swagger UI (if enabled)
    location /swagger-ui/ {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend - proxy to Vue.js SPA
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        return 500 '{"error":"Internal Server Error"}';
        add_header Content-Type application/json;
    }
}

# Grafana Server (separate subdomain or port)
server {
    listen 3000;
    server_name _;

    location / {
        proxy_pass http://grafana_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
