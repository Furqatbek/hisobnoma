version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hisobnoma-postgres
    environment:
      POSTGRES_DB: hisobnoma_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hisobnoma-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hisobnoma-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hisobnoma-network

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: hisobnoma-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - hisobnoma-network

  # Application (optional - for production-like testing)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hisobnoma-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hisobnoma_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    ports:
      - "8080:8080"
    networks:
      - hisobnoma-network

volumes:
  postgres_data:
  redis_data:

networks:
  hisobnoma-network:
    driver: bridge
