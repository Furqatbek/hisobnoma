# Backend-only compose (includes infra dependencies)
# Usage: docker compose -f docker-compose.backend.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: hisobnoma-postgres
    environment:
      POSTGRES_DB: hisobnoma_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hisobnoma-network

  redis:
    image: redis:7-alpine
    container_name: hisobnoma-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hisobnoma-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hisobnoma-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hisobnoma_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-hisobnoma_bot}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - hisobnoma-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  hisobnoma-network:
    driver: bridge
