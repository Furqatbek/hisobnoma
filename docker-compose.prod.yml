# =================================================
# Production Docker Compose for Hisobnoma Platform
# Includes: App, PostgreSQL, Redis, Nginx, Monitoring
# =================================================

services:
  # ==================== Application ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: hisobnoma/platform:${APP_VERSION:-latest}
    container_name: hisobnoma-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hisobnoma}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      - app_logs:/app/logs
      - app_data:/app/data
      - uploads_data:/app/uploads
    networks:
      - hisobnoma-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8080"
      - "prometheus.path=/actuator/prometheus"

  # ==================== Database ====================
  postgres:
    image: postgres:16-alpine
    container_name: hisobnoma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hisobnoma}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-hisobnoma}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hisobnoma-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==================== Redis Cache ====================
  redis:
    image: redis:7-alpine
    container_name: hisobnoma-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hisobnoma-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ==================== Frontend ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hisobnoma/frontend:${APP_VERSION:-latest}
    container_name: hisobnoma-frontend
    restart: unless-stopped
    networks:
      - hisobnoma-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Nginx Reverse Proxy ====================
  nginx:
    image: nginx:alpine
    container_name: hisobnoma-nginx
    restart: unless-stopped
    depends_on:
      - app
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    networks:
      - hisobnoma-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==================== Certbot (Let's Encrypt) ====================
  certbot:
    image: certbot/certbot
    container_name: hisobnoma-certbot
    restart: unless-stopped
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - hisobnoma-network

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: hisobnoma-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - hisobnoma-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:latest
    container_name: hisobnoma-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - hisobnoma-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

# ==================== Volumes ====================
volumes:
  postgres_data:
    name: hisobnoma_postgres_data
  postgres_backups:
    name: hisobnoma_postgres_backups
  redis_data:
    name: hisobnoma_redis_data
  app_logs:
    name: hisobnoma_app_logs
  app_data:
    name: hisobnoma_app_data
  nginx_logs:
    name: hisobnoma_nginx_logs
  prometheus_data:
    name: hisobnoma_prometheus_data
  grafana_data:
    name: hisobnoma_grafana_data
  uploads_data:
    name: hisobnoma_uploads_data
  certbot_conf:
    name: hisobnoma_certbot_conf
  certbot_www:
    name: hisobnoma_certbot_www

# ==================== Networks ====================
networks:
  hisobnoma-network:
    name: hisobnoma-network
    driver: bridge
