# Test Profile Configuration
spring:
  # Use H2 in-memory database for unit tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA Configuration for tests
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Disable Flyway for H2 tests
  flyway:
    enabled: false

  # Disable Redis for unit tests (use mock)
  data:
    redis:
      repositories:
        enabled: false

  # Cache - use simple cache for tests
  cache:
    type: simple

# Logging - minimal for tests
logging:
  level:
    root: WARN
    com.hisobnoma: INFO
    org.springframework: WARN

# Disable Swagger in tests
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
