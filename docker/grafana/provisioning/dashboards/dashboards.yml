# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'Hisobnoma Dashboards'
    orgId: 1
    folder: 'Hisobnoma'
    folderUid: 'hisobnoma'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
