spring:
  application:
    name: hisobnoma-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_size: 25
    show-sql: false

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    repair-on-migrate: true
    out-of-order: true

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.hisobnoma: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# Application Custom Configuration
app:
  name: Hisobnoma Platform
  version: 0.0.1

  # JWT Configuration
  # The default secret is a placeholder for dev/test only — startup FAILS
  # with the prod profile unless JWT_SECRET is set to >= 64 random chars.
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production-environment}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}     # 24 hours
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days
    issuer: hisobnoma-platform

  # CORS — comma-separated origins; restrict in production
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  # OTP Configuration
  otp:
    expiration-minutes: 5
    length: 6
    max-attempts: 3

  # Pagination Defaults
  pagination:
    default-page-size: 20
    max-page-size: 100

  # File Upload
  upload:
    max-file-size: 10MB
    allowed-extensions: jpg,jpeg,png,gif,pdf,xlsx,csv

  # SMS (DevSMS.uz)
  sms:
    enabled: ${SMS_ENABLED:false}
    api-token: ${SMS_API_TOKEN:}
    base-url: ${SMS_BASE_URL:https://devsms.uz/api}
    sender-id: ${SMS_SENDER_ID:4546}

  # Telegram Bot
  telegram:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:hisobnoma_bot}

  # Online card payment providers (shop). Disabled until a merchant account +
  # sandbox credentials exist; while disabled the API returns 503 and never
  # fakes a successful payment. Set <provider>.enabled=true with a merchant id.
  payment:
    payme:
      enabled: ${PAYME_ENABLED:false}
      merchant-id: ${PAYME_MERCHANT_ID:}
      secret-key: ${PAYME_KEY:}
      checkout-base-url: ${PAYME_CHECKOUT_URL:https://checkout.paycom.uz}
    click:
      enabled: ${CLICK_ENABLED:false}
      merchant-id: ${CLICK_MERCHANT_ID:}
      service-id: ${CLICK_SERVICE_ID:}
      secret-key: ${CLICK_SECRET:}
    uzum:
      enabled: ${UZUM_ENABLED:false}
      merchant-id: ${UZUM_MERCHANT_ID:}
      secret-key: ${UZUM_SECRET:}

  # Security
  security:
    password-min-length: 8
    max-login-attempts: 5
    lock-duration-minutes: 30
    password-reset-expiration-minutes: 60
    # Trust X-Forwarded-For for client IPs (rate limiting, audit). Keep true
    # behind a reverse proxy (nginx/ALB); set false when the app is exposed
    # directly, otherwise per-IP rate limits can be bypassed with a spoofed
    # header.
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:true}
