server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS resolver so backend hostname is resolved
    # at request time (not startup). This prevents Nginx from crashing
    # if the backend container isn't running yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Proxy API requests to backend (resolved at request time via variable).
    # IMPORTANT: proxy_pass with a variable must NOT include a URI path,
    # otherwise Nginx replaces the entire request URI instead of passing it through.
    # We use $request_uri to preserve the full original path.
    location /api/ {
        set $backend API_BACKEND_URL_PLACEHOLDER;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy uploaded files to backend
    location /uploads/ {
        set $backend API_BACKEND_URL_PLACEHOLDER;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 7d;
    }

    # Runtime config is rewritten at container start — never cache it, or a
    # redeploy's new tenant/backend values would be masked by a stale copy.
    location = /config.js {
        add_header Cache-Control "no-store";
        expires -1;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
