# Alertmanager Configuration for Hisobnoma Platform

global:
  # SMTP configuration for email alerts
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

  # Slack configuration
  slack_api_url: '${SLACK_WEBHOOK_URL}'

  # Default resolve timeout
  resolve_timeout: 5m

# Route tree for alert routing
route:
  # Default receiver
  receiver: 'default-receiver'

  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'job']

  # Wait time before sending notification for a group
  group_wait: 30s

  # Wait time before sending updated notifications
  group_interval: 5m

  # Wait time before resending notification
  repeat_interval: 4h

  # Child routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts - standard notification
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 1m
      repeat_interval: 4h

    # Info alerts - low priority
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      repeat_interval: 12h

# Inhibition rules - prevent alerting if higher severity exists
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']

  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'job']

# Receivers configuration
receivers:
  - name: 'default-receiver'
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
        headers:
          Subject: '[Hisobnoma] {{ .Status | toUpper }} - {{ .GroupLabels.alertname }}'
        html: |
          <!DOCTYPE html>
          <html>
          <head><style>
            body { font-family: Arial, sans-serif; }
            .alert { padding: 10px; margin: 5px 0; border-radius: 5px; }
            .critical { background-color: #ff4d4d; color: white; }
            .warning { background-color: #ffcc00; color: black; }
            .info { background-color: #00ccff; color: black; }
            .resolved { background-color: #00cc66; color: white; }
          </style></head>
          <body>
            <h2>{{ .Status | toUpper }}: {{ .GroupLabels.alertname }}</h2>
            {{ range .Alerts }}
            <div class="alert {{ .Labels.severity }}">
              <strong>{{ .Labels.alertname }}</strong>
              <p>{{ .Annotations.summary }}</p>
              <p>{{ .Annotations.description }}</p>
              <small>Started: {{ .StartsAt }}</small>
            </div>
            {{ end }}
          </body>
          </html>

  - name: 'critical-alerts'
    email_configs:
      - to: '${CRITICAL_ALERT_EMAIL}'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] Hisobnoma - {{ .GroupLabels.alertname }}'
    slack_configs:
      - channel: '#hisobnoma-alerts'
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: 'warning-alerts'
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
        headers:
          Subject: '[WARNING] Hisobnoma - {{ .GroupLabels.alertname }}'
    slack_configs:
      - channel: '#hisobnoma-alerts'
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Summary:* {{ .Annotations.summary }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  - name: 'info-alerts'
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: false
        headers:
          Subject: '[INFO] Hisobnoma - {{ .GroupLabels.alertname }}'

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'
