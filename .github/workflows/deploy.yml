# =================================================
# Production Deployment Workflow for Hisobnoma Platform
# =================================================

name: Deploy to Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # Build and Test
  # ===========================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: mvn clean verify -B -Dspring.profiles.active=test

      - name: Build application
        run: mvn clean package -DskipTests -B

      - name: Generate version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 1

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

  # ===========================================
  # Security Scan
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ===========================================
  # Build Docker Image
  # ===========================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ needs.build.outputs.version }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ===========================================
  # Deploy to Staging
  # ===========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || inputs.environment == 'staging'
    environment:
      name: staging
      # Override with a STAGING_URL repository variable; default matches the domain the
      # bundled nginx config + TLS certs actually serve (temurmchj.uz).
      url: ${{ vars.STAGING_URL || 'https://staging.temurmchj.uz' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/hisobnoma

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Deploy with zero-downtime
            docker compose -f docker-compose.prod.yml up -d --no-deps app

            # Wait for the container to report healthy. The app publishes no host port
            # (nginx reaches it on the compose network), so curl to localhost:8080 on the
            # host can never succeed — use the image's own HEALTHCHECK status instead.
            timeout 180 bash -c 'until [ -n "$(docker ps -q --filter label=com.docker.compose.service=app --filter health=healthy)" ]; do sleep 5; done'

            # Cleanup old images
            docker image prune -f

      - name: Run smoke tests
        env:
          BASE_URL: ${{ vars.STAGING_URL || 'https://staging.temurmchj.uz' }}
        run: |
          # Wait for deployment
          sleep 30

          # Test health endpoint
          curl -sf "$BASE_URL/actuator/health" || exit 1

          # Test the storefront through nginx (there is no /api/v1/health endpoint;
          # authenticated API routes cannot be smoke-tested unauthenticated)
          curl -sf "$BASE_URL/" -o /dev/null || exit 1

      - name: Notify on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ Staging deployment successful",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    {"title": "Version", "value": "${{ needs.build.outputs.version }}", "short": true},
                    {"title": "Environment", "value": "Staging", "short": true}
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # Deploy to Production
  # ===========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production'
    environment:
      name: production
      # Override with a PRODUCTION_URL repository variable; default matches the domain the
      # bundled nginx config + TLS certs actually serve (temurmchj.uz).
      url: ${{ vars.PRODUCTION_URL || 'https://temurmchj.uz' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create database backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/hisobnoma
            ./scripts/backup.sh

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/hisobnoma

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Blue-green deployment (requires the app service to have NO pinned
            # container_name — compose cannot scale a fixed-name service)
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale app=2 app

            # Wait until BOTH instances report healthy. The app publishes no host port
            # (nginx reaches it on the compose network), so curl to localhost:8080 on the
            # host can never succeed — use the image's own HEALTHCHECK status instead.
            timeout 240 bash -c 'until [ "$(docker ps -q --filter label=com.docker.compose.service=app --filter health=healthy | wc -l)" -ge 2 ]; do sleep 5; done'

            # Scale down to 1 instance
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale app=1 app

            # Cleanup
            docker image prune -f

      - name: Verify deployment
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://temurmchj.uz' }}
        run: |
          # Wait for deployment
          sleep 30

          # Test health endpoint
          curl -sf "$BASE_URL/actuator/health" || exit 1

          # Test the storefront through nginx (there is no /api/v1/health endpoint;
          # authenticated API routes cannot be smoke-tested unauthenticated)
          curl -sf "$BASE_URL/" -o /dev/null || exit 1

      - name: Create release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            CHANGELOG.md

      - name: Notify on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "🚀 Production deployment successful",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    {"title": "Version", "value": "${{ needs.build.outputs.version }}", "short": true},
                    {"title": "Environment", "value": "Production", "short": true}
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ Production deployment FAILED",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    {"title": "Version", "value": "${{ needs.build.outputs.version }}", "short": true},
                    {"title": "Workflow", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # Rollback (Manual Trigger)
  # ===========================================
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && failure()
    needs: deploy-production
    environment:
      name: production

    steps:
      - name: Rollback to previous version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/hisobnoma

            # Get previous image tag
            PREV_TAG=$(docker images --format "{{.Tag}}" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | sed -n '2p')

            # Rollback
            docker compose -f docker-compose.prod.yml pull app:${PREV_TAG}
            docker compose -f docker-compose.prod.yml up -d --no-deps app

      - name: Notify rollback
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "⚠️ Production rollback executed",
              "attachments": [
                {
                  "color": "warning",
                  "text": "Production has been rolled back to the previous version due to deployment failure."
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
